<title>Meta Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed sequencer-grid canvas under a slim app bar; floating filter card (left), inspector sheet (right), add dock (bottom).
   Two registers: the canvas content stays editorial (mono metadata, square tiles, generated thumbnails);
   the chrome around it follows shadcn/ui component conventions (tabs, button variants, badges, switch, inputs) re-skinned with the same tokens. */
:root{
  --bg:#0F0F0E; --grid:#191917; --grid-2:#22221F; --surface:#161615; --surface-2:#1F1F1D; --surface-3:#292926; --line:#2B2B28; --line-2:#3C3B37;
  --ink:#ECE8DF; --ink-2:#ABA79D; --ink-3:#77746C; --edge:#55534D; --hot:#E5553A; --note:#1C1A14;
  --st-idea:#8A877F; --st-draft:#D9A24E; --st-sched:#8FB7C9; --st-pub:#9DB36B;
  --shadow:0 12px 32px rgba(0,0,0,.45); --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --ring:0 0 0 2px var(--bg),0 0 0 4px color-mix(in srgb,var(--hot) 70%,transparent);
  --r:8px; --r-sm:6px;
  --f-ui:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --f-title:'Archivo','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
:root.paper{
  --bg:#ECECE9; --grid:#E2E2DE; --grid-2:#D5D5D0; --surface:#FBFBF9; --surface-2:#F1F1ED; --surface-3:#E6E6E1; --line:#DADAD4; --line-2:#C3C2BB;
  --ink:#151514; --ink-2:#4F4E49; --ink-3:#7E7C75; --edge:#A3A19A; --hot:#D9472C; --note:#F6F0DC;
  --st-idea:#7E7C75; --st-draft:#A8721A; --st-sched:#337493; --st-pub:#557426;
  --shadow:0 10px 26px rgba(21,21,20,.10); --shadow-sm:0 1px 2px rgba(21,21,20,.08);
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-ui);overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:none;box-shadow:var(--ring)}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-mono)}
.lbl{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
kbd{font:500 10.5px var(--f-mono);color:var(--ink-3);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;line-height:15px;min-width:9px;text-align:center}

/* ---------- app bar ---------- */
.bar{flex:none;display:flex;align-items:center;gap:10px 14px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);z-index:5;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-right:8px}
.brand svg{flex:none}
.brand b{font:650 15px var(--f-title);font-stretch:112%;letter-spacing:.01em;text-transform:uppercase}
.brand span{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.spacer{flex:1}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* tabs (shadcn Tabs): muted track, active tab raised */
.tabs{display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.tab{border:1px solid transparent;background:none;height:28px;padding:0 11px;border-radius:var(--r-sm);display:inline-flex;align-items:center;gap:7px;font:500 13px var(--f-ui);color:var(--ink-3);white-space:nowrap;transition:color .12s,background .12s}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--surface);border-color:var(--line-2);color:var(--ink);box-shadow:var(--shadow-sm)}
.tab[aria-pressed="true"] kbd{color:var(--ink-2)}
.tab .sq{width:6px;height:6px;background:var(--hot);display:none}
.tab[aria-pressed="true"] .sq{display:block}

/* buttons (shadcn Button variants) */
.btn{height:32px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:transparent;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;font:500 13px var(--f-ui);white-space:nowrap;text-decoration:none;transition:background .12s,border-color .12s,color .12s,opacity .12s}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.88;background:var(--ink)}
.btn.secondary{background:var(--surface-2);border-color:transparent}
.btn.secondary:hover{background:var(--surface-3)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--hot);border-color:color-mix(in srgb,var(--hot) 45%,transparent)}
.btn.danger:hover{background:color-mix(in srgb,var(--hot) 12%,transparent)}
.btn.danger.solid{background:var(--hot);border-color:var(--hot);color:#fff}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.icon{width:32px;padding:0}
.btn.icon.sm{width:28px}
.btn[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink-3)}
.btn[disabled]{opacity:.4;cursor:not-allowed;pointer-events:none}

/* badges (shadcn Badge) */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font:500 11px/1 var(--f-ui);white-space:nowrap;
  border:1px solid color-mix(in srgb,var(--sc) 38%,transparent);background:color-mix(in srgb,var(--sc) 15%,transparent);color:color-mix(in srgb,var(--sc) 55%,var(--ink))}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc)}
.badge.outline{--sc:var(--ink-3);background:transparent;border-color:var(--line-2);color:var(--ink-2);font:500 10px/1 var(--f-mono);letter-spacing:.06em;padding:0 6px;border-radius:4px;height:18px}
.badge.outline::before{display:none}
.st-idea{--sc:var(--st-idea)} .st-draft{--sc:var(--st-draft)} .st-scheduled{--sc:var(--st-sched)} .st-published{--sc:var(--st-pub)} .st-private{--sc:var(--ink-3)}

/* toggles for filters (shadcn Toggle, outline) */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;border:1px solid var(--line-2);background:transparent;border-radius:var(--r-sm);padding:0 9px;font:500 12.5px var(--f-ui);display:inline-flex;align-items:center;gap:7px;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s}
.chip:hover{background:var(--surface-2);color:var(--ink)}
.chip i{font:normal 500 10.5px var(--f-mono);color:var(--ink-3)}
.chip.dot::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--tc)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] i{color:inherit;opacity:.6}
.chip[aria-pressed="true"]::after{content:"";width:9px;height:5px;border-left:1.6px solid currentColor;border-bottom:1.6px solid currentColor;transform:rotate(-45deg) translate(1px,-1px);margin-left:-1px}

/* inputs (shadcn Input / Textarea / Select) */
.input,.fld input,.fld select,.fld textarea,.mini input,.mini select{height:34px;border:1px solid var(--line-2);background:transparent;border-radius:var(--r-sm);padding:0 10px;min-width:0;width:100%;box-sizing:border-box;font:400 13.5px var(--f-ui);transition:border-color .12s,box-shadow .12s}
.fld textarea{height:auto;min-height:86px;padding:8px 10px;resize:vertical;line-height:1.5}
.fld select,.mini select{appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat}
.input::placeholder,.fld input::placeholder,.fld textarea::placeholder,.mini input::placeholder{color:var(--ink-3)}
.input:hover,.fld input:hover,.fld select:hover,.fld textarea:hover,.mini input:hover,.mini select:hover{border-color:var(--ink-3)}
.input:focus-visible,.fld input:focus-visible,.fld select:focus-visible,.fld textarea:focus-visible,.mini input:focus-visible,.mini select:focus-visible{border-color:var(--ink-2)}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:9px;color:var(--ink-3);pointer-events:none}
.search-wrap .input{padding-left:32px}
#f-title{font:600 16px var(--f-title)}
input[type="date"]{color-scheme:inherit}

/* checkbox + switch */
.chk{display:flex;align-items:center;gap:10px;font:500 13px var(--f-ui);color:var(--ink-2);cursor:pointer}
.chk input{appearance:none;margin:0;flex:none;width:16px;height:16px;border:1px solid var(--ink-3);border-radius:4px;display:grid;place-items:center;cursor:pointer;transition:background .12s,border-color .12s}
.chk input::after{content:"";width:8px;height:4px;border-left:1.8px solid var(--bg);border-bottom:1.8px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.chk input:checked{background:var(--ink);border-color:var(--ink)}
.chk input:checked::after{opacity:1}
.chk input.switch{width:34px;height:20px;border-radius:999px;border:0;background:var(--surface-3);display:block;position:relative}
.chk input.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border:0;border-radius:50%;background:var(--ink-2);transform:none;opacity:1;transition:left .15s,background .15s}
.chk input.switch:checked{background:var(--ink)}
.chk input.switch:checked::after{left:16px;background:var(--bg)}

/* ---------- stage ---------- */
.stage{flex:1;position:relative;min-height:0}
#canvas{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:linear-gradient(var(--grid-2) 1px,transparent 1px),linear-gradient(90deg,var(--grid-2) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:120px 120px,120px 120px,24px 24px,24px 24px}
#canvas.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#bg,#edges,#drag-layer{position:absolute;left:0;top:0;pointer-events:none}
#edges,#drag-layer{width:1px;height:1px;overflow:visible}

/* ---------- nodes (editorial register) ---------- */
.node{position:absolute;left:0;top:0;background:var(--surface);border:1px solid var(--line);border-radius:4px;user-select:none;-webkit-user-select:none;cursor:pointer;transition:opacity .2s,border-color .15s;--bc:var(--ink)}
.node:hover{border-color:var(--line-2)}
.node.t-note{background:var(--note)}
.node.dim{opacity:.16}
.node.fade{opacity:.42}
.node.dim.nb,.node.fade.nb{opacity:.9}
.node:focus-visible{box-shadow:var(--ring)}
.node::after{content:"";position:absolute;inset:-8px;pointer-events:none;opacity:0;transition:opacity .12s,inset .12s;
  background:
   linear-gradient(var(--bc),var(--bc)) left top/12px 1.5px no-repeat, linear-gradient(var(--bc),var(--bc)) left top/1.5px 12px no-repeat,
   linear-gradient(var(--bc),var(--bc)) right top/12px 1.5px no-repeat, linear-gradient(var(--bc),var(--bc)) right top/1.5px 12px no-repeat,
   linear-gradient(var(--bc),var(--bc)) left bottom/12px 1.5px no-repeat, linear-gradient(var(--bc),var(--bc)) left bottom/1.5px 12px no-repeat,
   linear-gradient(var(--bc),var(--bc)) right bottom/12px 1.5px no-repeat, linear-gradient(var(--bc),var(--bc)) right bottom/1.5px 12px no-repeat}
.node.sel{border-color:var(--ink-2)}
.node.sel::after{opacity:1}
.connecting .node:not(.src):not(.no-drop)::after{opacity:1;--bc:var(--line-2)}
.connecting .node.src::after{opacity:1;--bc:var(--ink)}
.connecting .node.no-drop{opacity:.3}
.connecting #canvas,.connecting .node{cursor:crosshair}
.node.drop{border-color:var(--hot)}
.node.drop::after{opacity:1!important;--bc:var(--hot)!important;inset:-12px;animation:lock .8s ease-in-out infinite alternate}
@keyframes lock{from{inset:-12px}to{inset:-7px}}

.nhead{height:32px;display:flex;align-items:center;gap:7px;padding:0 9px 0 11px;font:500 9.5px var(--f-mono);text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3)}
.nhead .badge:not(.outline){margin-left:auto}
.nhead .badge{text-transform:none}

.port{position:absolute;right:-6px;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:var(--surface);border:1.5px solid var(--edge);box-sizing:border-box;cursor:crosshair;transition:transform .12s,background .12s,border-color .12s,box-shadow .12s;z-index:1}
.port::before{content:"";position:absolute;inset:-10px;border-radius:50%}
.node:hover .port{border-color:var(--ink);transform:scale(1.25)}
.port:hover{background:var(--hot);border-color:var(--hot);transform:scale(1.5)!important;box-shadow:0 0 0 5px color-mix(in srgb,var(--hot) 22%,transparent)}
.connecting .node.src .port{background:var(--hot);border-color:var(--hot);transform:scale(1.5)}
.public .port{display:none}

.thumb{position:relative;height:108px;margin:0 10px;border-radius:2px;overflow:hidden;background:#0E0E0D}
.thumb svg{display:block;width:100%;height:100%}
.dur{position:absolute;right:6px;bottom:6px;font:500 9.5px/1 var(--f-mono);letter-spacing:.06em;background:#ECE8DF;color:#0E0E0D;padding:3px 5px 3px 4px;border-radius:2px;display:flex;align-items:center;gap:4px}
.dur::before{content:"";border-left:5px solid #0E0E0D;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.thumb.empty{background:var(--surface-2);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:16px 16px;background-position:-1px -1px}
.thumb.empty span{position:absolute;inset:0;display:grid;place-items:center;font:500 9.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.thumb.empty span b{font-weight:500;background:var(--surface-2);padding:2px 6px}
.thumb.empty::after{content:"";position:absolute;inset:8px;
  background:linear-gradient(var(--ink-3),var(--ink-3)) left top/10px 1px no-repeat,linear-gradient(var(--ink-3),var(--ink-3)) left top/1px 10px no-repeat,linear-gradient(var(--ink-3),var(--ink-3)) right top/10px 1px no-repeat,linear-gradient(var(--ink-3),var(--ink-3)) right top/1px 10px no-repeat,linear-gradient(var(--ink-3),var(--ink-3)) left bottom/10px 1px no-repeat,linear-gradient(var(--ink-3),var(--ink-3)) left bottom/1px 10px no-repeat,linear-gradient(var(--ink-3),var(--ink-3)) right bottom/10px 1px no-repeat,linear-gradient(var(--ink-3),var(--ink-3)) right bottom/1px 10px no-repeat}
.nbody{padding:10px 12px 12px;display:grid;gap:6px}
.ntitle{font:600 14.5px/1.22 var(--f-title);font-stretch:96%;letter-spacing:-.005em;text-wrap:balance;color:var(--ink)}
.ntitle.empty{color:var(--ink-3);font-weight:500}
.nmeta{font:400 10px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px}
.tag{display:inline-flex;align-items:center;gap:5px;font:500 9.5px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-2)}
.tag::before{content:"";width:7px;height:7px;background:var(--tc)}

.node.t-person{border-radius:999px;display:flex;align-items:center;gap:11px;padding:8px 20px 8px 8px}
.node.t-person::after{inset:-8px -6px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:700 15px var(--f-title);font-stretch:110%;color:#0E0E0D;background:var(--av)}
.pbody{min-width:0;display:grid;gap:2px}
.pbody .nmeta{white-space:nowrap}
.pkind{font:500 9px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.pv-avatar{width:76px;height:76px;font-size:26px}

/* ---------- edges ---------- */
.edge{fill:none;stroke:var(--edge);stroke-width:1.4;transition:opacity .2s}
.edge.k-attachment{stroke-dasharray:3 4}
.edge.k-references{stroke-dasharray:.5 5;stroke-linecap:round;stroke-width:2.2}
.edge.k-inspired-by{stroke-dasharray:9 5}
.edge.hl{stroke:var(--ink);stroke-width:2}
.edge.dim{opacity:.12}
.edge.temp{stroke:var(--hot);stroke-width:1.8;stroke-dasharray:6 5}
.edge.temp.snapped{stroke-dasharray:none;stroke-width:2.4}
.elabel{font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round;text-anchor:middle}
.snap-tip{font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;fill:var(--hot);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.snap-dot{fill:var(--bg);stroke:var(--hot);stroke-width:2}
.snap-dot.on{fill:var(--hot)}
#arrow path{fill:var(--edge)}
#arrowHl path{fill:var(--ink)}

/* ---------- layout backgrounds ---------- */
#halos{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
.halo{opacity:.11}
:root.paper .halo{opacity:.16}
.halo rect{fill:var(--tc)}
.halo.off{opacity:.03}
.cl-label{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:650 46px/1 var(--f-title);font-stretch:112%;text-transform:uppercase;letter-spacing:.005em;color:var(--tc);display:flex;align-items:baseline;gap:12px;transition:opacity .2s}
:root.paper .cl-label{color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.cl-label small{font:500 13px var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.cl-label.off{opacity:.22}
.lane{position:absolute;border-top:1px solid var(--line-2)}
.lane h3{margin:14px 0 0 20px;font:650 26px/1 var(--f-title);font-stretch:112%;text-transform:uppercase;color:var(--ink-2)}
.tick{position:absolute;border-left:1px dashed var(--line)}
.tick span{position:absolute;top:0;left:6px;font:500 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.tick.month span{color:var(--ink)}
.tick.today{border-left:1.5px solid var(--hot)}
.tick.today span{color:#fff;background:var(--hot);padding:2px 6px;left:-1px;top:-4px;border-radius:3px}
.backlog{position:absolute;border-left:1px dashed var(--ink-3)}
.backlog span{position:absolute;top:-40px;left:10px;font:500 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap}

/* ---------- cards / panels (shadcn Card, Sheet) ---------- */
.panel{position:absolute;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3}
#filters{left:12px;top:12px;width:272px;max-height:calc(100% - 24px);overflow:auto;padding:14px;display:grid;gap:18px}
#filters .lbl{margin-bottom:9px;display:block}
.fp-foot{display:flex;justify-content:space-between;align-items:center;font:500 11px var(--f-mono);letter-spacing:.06em;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px}

#insp{right:12px;top:12px;bottom:12px;width:352px;overflow:auto;display:flex;flex-direction:column}
.ih{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-bottom:1px solid var(--line);z-index:1}
.ih .x{margin-left:auto;border:0;background:none;width:30px;height:30px;border-radius:var(--r-sm);font-size:19px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.ih .x:hover{background:var(--surface-2);color:var(--ink)}
.ib{padding:16px;display:grid;gap:16px}
.fld{display:grid;gap:7px}
.fld>.lbl{font:500 12.5px var(--f-ui);letter-spacing:0;text-transform:none;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* status: segmented control in the Tabs style */
.statseg{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r)}
.statseg button{height:28px;border:1px solid transparent;background:transparent;border-radius:var(--r-sm);font:500 12px var(--f-ui);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink-3)}
.statseg button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc);opacity:.6}
.statseg button:hover{color:var(--ink)}
.statseg button[aria-pressed="true"]{background:var(--surface);border-color:var(--line-2);color:var(--ink);box-shadow:var(--shadow-sm)}
.statseg button[aria-pressed="true"]::before{opacity:1}
.conn{display:grid;gap:8px}
.conn-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:8px;align-items:center}
.conn-row .dir{font:500 11px var(--f-mono);color:var(--ink-3)}

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const f2 = v => +v.toFixed(2);
function h32(s){ let h=2166136261; for(const c of String(s)){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function rng(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const handleOf = n => { const raw=(n.handle||'').trim(); const m=raw.match(/(?:x|twitter)\.com\/([A-Za-z0-9_]+)/)||(n.url||'').match(/(?:x|twitter)\.com\/([A-Za-z0-9_]+)/); return m?m[1]:raw.replace(/^@/,''); };
const isXUrl = u => /(?:^|\/\/)(?:www\.)?(?:x|twitter)\.com\//.test(u||'');

function load(data){

}

/* ---------- visibility & filters ---------- */
function computeVis(){
  const hidden=new Set(), dim=new Set(), f=S.f;
  if(S.mode==='public'){
    S.nodes.forEach(n=>{ if(n.private || (n.type==='video' && (n.status==='idea'||n.status==='draft'))) hidden.add(n.id); });
    S.nodes.forEach(n=>{ if(n.type!=='video' && !hidden.has(n.id)){ const nb=neighbors(n.id); if(nb.length && nb.every(id=>hidden.has(id))) hidden.add(n.id); }});
  }
  const active = f.topics.size||f.plats.size||(S.mode==='edit'&&f.stats.size)||f.q;
  if(active){
    const q=f.q.toLowerCase();
    S.nodes.forEach(n=>{
      if(hidden.has(n.id)) return;
      let ok=true;
      if(f.topics.size && !n.topics.some(t=>f.topics.has(t))) ok=false;
      if(ok && f.plats.size && !(n.type==='video' && f.plats.has(n.platform))) ok=false;
      if(ok && S.mode==='edit' && f.stats.size && !(n.type==='video' && f.stats.has(n.status))) ok=false;
      if(ok && q && !(n.title+' '+n.summary).toLowerCase().includes(q)) ok=false;
      if(!ok){ if(f.hide) hidden.add(n.id); else dim.add(n.id); }
    });
  }
  S.vis={hidden,dim};
}

/* ---------- generated thumbnails: a step-sequencer pattern seeded by the video ---------- */
function thumbSVG(n){
  const C=14, R=7, r=rng(h32(n.id+'|'+n.title));
  const cols=n.topics.map(topic).filter(Boolean).map(t=>t.color); if(!cols.length) cols.push('#C9B99A');
  let s='<svg viewBox="0 0 '+C+' '+R+'" preserveAspectRatio="xMidYMid slice" aria-hidden="true">';
  let g=''; for(let x=1;x<C;x++) g+='M'+x+' 0V'+R; for(let y=1;y<R;y++) g+='M0 '+y+'H'+C;
  s+='<path d="'+g+'" stroke="#1E1E1C" stroke-width=".03" fill="none"/>';
  const kinds=['solid','dot','ring','x','quad','bars','hatch','dots9','solid','dot'];
  for(let y=0;y<R;y++) for(let x=0;x<C;x++){
    if(r()>.3) continue;
    const c=r()<.14?CREAM:cols[Math.floor(r()*cols.length)], k=kinds[Math.floor(r()*kinds.length)];
    const X=x+.08, Y=y+.08, z=.84, m=(a,b)=>f2(X+z*a)+' '+f2(Y+z*b);
    const rect=(fill)=>'<rect x="'+f2(X)+'" y="'+f2(Y)+'" width="'+z+'" height="'+z+'" fill="'+fill+'"/>';
    if(k==='solid') s+=rect(c);
    else if(k==='dot') s+=rect(CREAM)+'<circle cx="'+f2(X+z/2)+'" cy="'+f2(Y+z/2)+'" r="'+f2(z*.27)+'" fill="'+BLACK+'"/>';
    else if(k==='ring') s+=rect(c)+'<circle cx="'+f2(X+z/2)+'" cy="'+f2(Y+z/2)+'" r="'+f2(z*.2)+'" fill="none" stroke="'+BLACK+'" stroke-width="'+f2(z*.12)+'"/>';
    else if(k==='x') s+=rect(c)+'<path d="M'+m(.24,.24)+'L'+m(.76,.76)+'M'+m(.76,.24)+'L'+m(.24,.76)+'" stroke="'+BLACK+'" stroke-width="'+f2(z*.15)+'" stroke-linecap="round"/>';
    else if(k==='quad') [[.08,.08],[.56,.08],[.08,.56],[.56,.56]].forEach(([a,b])=>{ s+='<rect x="'+f2(X+z*a)+'" y="'+f2(Y+z*b)+'" width="'+f2(z*.36)+'" height="'+f2(z*.36)+'" fill="'+CREAM+'"/>'; });
    else if(k==='bars') s+=rect(c)+'<rect x="'+f2(X+z*.28)+'" y="'+f2(Y+z*.2)+'" width="'+f2(z*.15)+'" height="'+f2(z*.6)+'" rx="'+f2(z*.06)+'" fill="'+BLACK+'" opacity=".55"/><rect x="'+f2(X+z*.57)+'" y="'+f2(Y+z*.2)+'" width="'+f2(z*.15)+'" height="'+f2(z*.6)+'" rx="'+f2(z*.06)+'" fill="'+BLACK+'" opacity=".55"/>';
    else if(k==='hatch') s+='<path d="M'+m(0,1)+'L'+m(1,0)+'M'+m(0,.5)+'L'+m(.5,0)+'M'+m(.5,1)+'L'+m(1,.5)+'M'+m(0,.25)+'L'+m(.25,0)+'M'+m(.75,1)+'L'+m(1,.75)+'" stroke="'+c+'" stroke-width=".07"/>';
    else if(k==='dots9'){ s+=rect(c); [.24,.5,.76].forEach(a=>[.24,.5,.76].forEach(b=>{ s+='<circle cx="'+f2(X+z*a)+'" cy="'+f2(Y+z*b)+'" r="'+f2(z*.07)+'" fill="'+BLACK+'" opacity=".7"/>'; })); }
  }
  s+='<path d="M.35 1.25V.35H1.25M'+(C-1.25)+' .35H'+(C-.35)+'V1.25M.35 '+(R-1.25)+'V'+(R-.35)+'H1.25M'+(C-1.25)+' '+(R-.35)+'H'+(C-.35)+'V'+(R-1.25)+'" stroke="'+CREAM+'" stroke-width=".07" fill="none"/>';
  return s+'</svg>';
}
function thumbHTML(n,cls=''){
  if(n.status==='idea'||n.status==='draft') return '<div class="thumb empty '+cls+'"><span><b>Not published</b></span></div>';
  return '<div class="thumb '+cls+'">'+thumbSVG(n)+(n.duration?'<span class="dur">'+esc(n.duration)+'</span>':'')+'</div>';
}

function personMeta(n){ const p=[]; if(handleOf(n)) p.push('@'+handleOf(n)); if(n.url&&!isXUrl(n.url)) p.push(host(n.url)); return p.join(' · ')||'No link yet'; }

}
function updateNode(n){ ensureEl(n); n.h=els.get(n.id).offsetHeight; applyClasses(); }
function placeNode(n){ const el=els.get(n.id); if(el) el.style.transform='translate('+n.x+'px,'+n.y+'px)'; }
function applyClasses(){
  const {hidden,dim}=S.vis; const sel=S.sel; const nb=sel?new Set(neighbors(sel)):null;
  S.nodes.forEach(n=>{
    const el=els.get(n.id); if(!el) return;

    el.classList.toggle('fade',!!nb&&n.id!==sel&&!nb.has(n.id));
  });
}

/* ---------- edges: floating, each end attaches to the side facing the other node ---------- */
const SIDES={r:[1,0],l:[-1,0],b:[0,1],t:[0,-1]};
function sidePoint(n,s){
  const cx=n.x+n.w/2, cy=n.y+n.h/2;
  return s==='r'?{x:n.x+n.w,y:cy}:s==='l'?{x:n.x,y:cy}:s==='b'?{x:cx,y:n.y+n.h}:{x:cx,y:n.y};
}
function facing(a,b){ // sides of a and b that face each other
  const dx=(b.x+b.w/2)-(a.x+a.w/2), dy=(b.y+b.h/2)-(a.y+a.h/2);
  const gx=Math.abs(dx)-(a.w+b.w)/2, gy=Math.abs(dy)-(a.h+b.h)/2;
  if(gx>=gy||gx>0) return dx>=0?['r','l']:['l','r'];
  return dy>=0?['b','t']:['t','b'];
}
function curve(p1,n1,p2,n2){
  const k=Math.max(40,Math.hypot(p2.x-p1.x,p2.y-p1.y)*.38);
  const c1={x:p1.x+n1[0]*k,y:p1.y+n1[1]*k}, c2={x:p2.x+n2[0]*k,y:p2.y+n2[1]*k};
  return {d:'M'+f2(p1.x)+','+f2(p1.y)+' C'+f2(c1.x)+','+f2(c1.y)+' '+f2(c2.x)+','+f2(c2.y)+' '+f2(p2.x)+','+f2(p2.y),
    mx:(p1.x+3*c1.x+3*c2.x+p2.x)/8, my:(p1.y+3*c1.y+3*c2.y+p2.y)/8, p2};
}
function link(a,b){ const [sa,sb]=facing(a,b); return curve(sidePoint(a,sa),SIDES[sa],sidePoint(b,sb),SIDES[sb]); }
function toPoint(a,w){
  const inside=w.x>=a.x&&w.x<=a.x+a.w&&w.y>=a.y&&w.y<=a.y+a.h;
  const sa=inside?'r':facing(a,{x:w.x,y:w.y,w:0,h:0})[0], n=SIDES[sa];
  return curve(sidePoint(a,sa),n,w,[-n[0]*.3,-n[1]*.3]);
}
function renderEdges(){
  const {hidden,dim}=S.vis; let p='', l='';
  S.edges.forEach(e=>{
    const a=node(e.from), b=node(e.to); if(!a||!b||hidden.has(a.id)||hidden.has(b.id)) return;
    const g=link(a,b);
    const hl=S.sel&&(e.from===S.sel||e.to===S.sel);
    const dm=(dim.has(a.id)||dim.has(b.id))&&!hl;
    const arrow=e.kind!=='attachment'&&e.kind!=='related';
    p+='<path class="edge k-'+e.kind+(hl?' hl':'')+(dm?' dim':'')+'" d="'+g.d+'"'+(arrow?' marker-end="url(#'+(hl?'arrowHl':'arrow')+')"':'')+'></path>';
    if(hl) l+='<text class="elabel" x="'+f2(g.mx)+'" y="'+f2(g.my-7)+'">'+EK[e.kind]+'</text>';
  });
  edgeG.innerHTML=p; labelG.innerHTML=l;
}

/* ---------- layouts ---------- */
function computeLayout(){
  const vis=S.nodes.filter(n=>!S.vis.hidden.has(n.id));
  if(S.layout==='free'){ S.nodes.forEach(n=>{n.tx=n.fx;n.ty=n.fy;}); S.bg=null; return; }
  if(S.layout==='cluster') return clusterLayout(vis);
  return timelineLayout(vis);
}
function clusterLayout(vis){
  const has=(n,id)=>n.topics.includes(id);
  const cnt=id=>vis.filter(n=>has(n,id)).length;
  const co=(a,b)=>vis.filter(n=>has(n,a)&&has(n,b)).length;
  const pool=S.topics.filter(t=>cnt(t.id)).sort((a,b)=>cnt(b.id)-cnt(a.id)); const order=[];
  if(pool.length) order.push(pool.shift());
  while(pool.length){ const last=order[order.length-1].id; pool.sort((a,b)=>co(last,b.id)-co(last,a.id)||cnt(b.id)-cnt(a.id)); order.push(pool.shift()); }
  const N=Math.max(order.length,1), R=Math.max(420,N*150), anchor={};
  order.forEach((t,i)=>{ const a=-Math.PI/2+i*2*Math.PI/N; anchor[t.id]={x:Math.cos(a)*R,y:Math.sin(a)*R}; });
  const home=new Map();
  const jit=n=>{ const h=h32(n.id)%360/360*Math.PI*2; return {x:Math.cos(h)*46,y:Math.sin(h)*46}; };
  vis.forEach(n=>{ const ts=n.topics.filter(id=>anchor[id]); if(!ts.length) return;
    const j=jit(n); home.set(n.id,{x:ts.reduce((s,id)=>s+anchor[id].x,0)/ts.length+j.x,y:ts.reduce((s,id)=>s+anchor[id].y,0)/ts.length+j.y}); });
  vis.forEach(n=>{ if(home.has(n.id)) return;
    const nb=neighbors(n.id).map(id=>home.get(id)).filter(Boolean); const j=jit(n);
    home.set(n.id,nb.length?{x:nb.reduce((s,p)=>s+p.x,0)/nb.length+j.x*2,y:nb.reduce((s,p)=>s+p.y,0)/nb.length+j.y*2}:{x:j.x,y:j.y}); });
  const it=vis.map(n=>{ const h=home.get(n.id); return {n,hx:h.x,hy:h.y,x:h.x,y:h.y}; });
  const pins=order.map(t=>({fixed:true,x:anchor[t.id].x,y:anchor[t.id].y,n:{w:t.name.length*31+110,h:70}}));
  const all=it.concat(pins), M=30;
  for(let k=0;k<280;k++){
    for(let i=0;i<all.length;i++) for(let j=i+1;j<all.length;j++){
      const a=all[i], b=all[j]; if(a.fixed&&b.fixed) continue;
      const dx=a.x-b.x, dy=a.y-b.y;
      const px=(a.n.w+b.n.w)/2+M-Math.abs(dx), py=(a.n.h+b.n.h)/2+M-Math.abs(dy);
      if(px<=0||py<=0) continue;
      const fa=a.fixed?0:b.fixed?1:.5, fb=b.fixed?0:a.fixed?1:.5;
      if(px<py){ const s=dx>=0?px:-px; a.x+=s*fa; b.x-=s*fb; } else { const s=dy>=0?py:-py; a.y+=s*fa; b.y-=s*fb; }
    }
    it.forEach(p=>{ p.x+=(p.hx-p.x)*.03; p.y+=(p.hy-p.y)*.03; });
  }
  it.forEach(p=>{ p.n.tx=p.x-p.n.w/2; p.n.ty=p.y-p.n.h/2; });
  const P=44, halos=[], labels=[];
  order.forEach(t=>{
    const mem=it.filter(p=>has(p.n,t.id)); if(!mem.length) return;
    halos.push({t,rects:mem.map(p=>({x:p.n.tx-P,y:p.n.ty-P,w:p.n.w+P*2,h:p.n.h+P*2}))});
    labels.push({t,x:anchor[t.id].x,y:anchor[t.id].y,n:mem.length});
  });
  S.bg={type:'cluster',halos,labels};
}
function timelineLayout(vis){
  const DAY=864e5, PX=30, ms=d=>Date.parse(d+'T00:00:00Z');
  const dated=vis.filter(n=>n.date), und=vis.filter(n=>!n.date);
  const times=dated.map(n=>ms(n.date)).concat(ms(TODAY));
  const t0=Math.min(...times)-4*DAY, t1=Math.max(...times)+5*DAY;
  const xOf=t=>(t-t0)/DAY*PX, bx=xOf(t1)+120;
  const laneOf=n=>n.type==='person'?'people':n.type==='video'&&PLATS[n.platform]?n.platform:'other';
  const lanes=[['youtube','YouTube'],['instagram','Instagram'],['x','X'],['other','Links, bookmarks & notes'],['people','People']];
  let y=0; const laneRects=[];
  lanes.forEach(([key,label])=>{
    const items=dated.filter(n=>laneOf(n)===key).sort((a,b)=>ms(a.date)-ms(b.date));
    const back=und.filter(n=>laneOf(n)===key);
    if(!items.length&&!back.length) return;
    const ends=[]; const rowOf=new Map();
    items.forEach(n=>{ const x=xOf(ms(n.date)); let r=ends.findIndex(e=>e<=x-18); if(r<0){r=ends.length;ends.push(0);} ends[r]=x+n.w; rowOf.set(n.id,r); n.tx=x; });
    const all=items.concat(back); const rh=Math.max(70,...all.map(n=>n.h))+26;
    back.forEach((n,i)=>{ rowOf.set(n.id,i); n.tx=bx+30; });
    const rows=Math.max(ends.length,back.length,1);
    all.forEach(n=>{ n.ty=y+58+rowOf.get(n.id)*rh; });
    const h=58+rows*rh+10; laneRects.push({y,h,label}); y+=h;
  });
  const ticks=[];
  for(let t=t0;t<=t1;t+=DAY){ const dt=new Date(t); if(dt.getUTCDay()===1||dt.getUTCDate()===1) ticks.push({x:xOf(t),month:dt.getUTCDate()===1,label:dt.toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'})}); }
  S.bg={type:'timeline',lanes:laneRects,ticks,today:xOf(ms(TODAY)),bx,w:bx+W.video+90,h:y};
}
function renderBg(){
  const b=S.bg; if(!b){ bgEl.innerHTML=''; return; }
  if(b.type==='cluster'){
    const off=t=>S.f.topics.size&&!S.f.topics.has(t.id)?' off':'';
    let h='<svg id="halos" aria-hidden="true">'+b.halos.map(g=>'<g class="halo'+off(g.t)+'" style="--tc:'+g.t.color+'">'+g.rects.map(r=>'<rect x="'+f2(r.x)+'" y="'+f2(r.y)+'" width="'+f2(r.w)+'" height="'+f2(r.h)+'" rx="20"/>').join('')+'</g>').join('')+'</svg>';
    h+=b.labels.map(l=>'<div class="cl-label'+off(l.t)+'" style="--tc:'+l.t.color+';left:'+f2(l.x)+'px;top:'+f2(l.y)+'px">'+esc(l.t.name)+'<small>'+String(l.n).padStart(2,'0')+'</small></div>').join('');
    bgEl.innerHTML=h;
  } else {
    let h=b.lanes.map(l=>'<div class="lane" style="left:-60px;top:'+l.y+'px;width:'+(b.w+60)+'px;height:'+l.h+'px"><h3>'+esc(l.label)+'</h3></div>').join('');
    h+=b.ticks.map(t=>'<div class="tick'+(t.month?' month':'')+'" style="left:'+t.x+'px;top:-34px;height:'+(b.h+34)+'px"><span>'+t.label+'</span></div>').join('');
    h+='<div class="tick today" style="left:'+b.today+'px;top:-34px;height:'+(b.h+34)+'px"><span>Today</span></div>';
    h+='<div class="backlog" style="left:'+b.bx+'px;top:0;height:'+b.h+'px"><span>Backlog · no date yet</span></div>';
    bgEl.innerHTML='<div style="position:absolute;left:0;top:0">'+h+'</div>';
  }
}
let anim=null;
function relayout(animate=true){
  computeVis(); computeLayout(); renderBg(); applyClasses(); syncTidy();
  if(anim) cancelAnimationFrame(anim);
  const from=S.nodes.map(n=>[n,n.x,n.y]);
  const moving=from.some(([n,x,y])=>n.tx!==x||n.ty!==y);
  if(!animate||reduced||!moving){ S.nodes.forEach(n=>{n.x=n.tx;n.y=n.ty;placeNode(n);}); renderEdges(); return; }
  const t0=performance.now(), D=520, ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const step=now=>{
    const t=Math.min(1,(now-t0)/D), e=ease(t);
    from.forEach(([n,x,y])=>{ n.x=x+(n.tx-x)*e; n.y=y+(n.ty-y)*e; placeNode(n); });
    renderEdges(); anim=t<1?requestAnimationFrame(step):null;
  };
  anim=requestAnimationFrame(step);
}
function refresh(){ computeVis(); applyClasses(); renderEdges(); renderFilters(); if(S.bg?.type==='cluster') renderBg(); }

/* ---------- tidy: soft grid with equal gutters, staying close to where things were ---------- */
const GRID=24, GAP=48;
let undoTidy=null, undoTimer=null;
function tidy(){
  if(S.layout!=='free'||S.mode!=='edit') return;
  const vis=S.nodes.filter(n=>!S.vis.hidden.has(n.id)); if(vis.length<2) return;
  const before=new Map(vis.map(n=>[n.id,{x:n.fx,y:n.fy}]));
  const snap=v=>Math.round(v/GRID)*GRID;
  const it=vis.map(n=>({n,x:snap(n.fx),y:snap(n.fy),w:n.w,h:n.h}));
  // 1. columns: left edges that are close together share one x
  const cols=[];
  [...it].sort((a,b)=>a.x-b.x).forEach(p=>{ const c=cols[cols.length-1]; if(c&&p.x-c.first<=96) c.items.push(p); else cols.push({first:p.x,items:[p]}); });
  cols.forEach(c=>{ const xs=c.items.map(p=>p.x).sort((a,b)=>a-b); const m=xs[Math.floor((xs.length-1)/2)]; c.items.forEach(p=>{p.x=m;p.col=c;}); c.x=m; });
  // 2. rows: tops that are close together across columns share one y
  const rows=[];
  [...it].sort((a,b)=>a.y-b.y).forEach(p=>{ const r=rows[rows.length-1]; if(r&&p.y-r.first<=48&&!r.items.some(q=>q.col===p.col)) r.items.push(p); else rows.push({first:p.y,items:[p]}); });
  rows.forEach(r=>{ if(r.items.length<2) return; const ys=r.items.map(p=>p.y).sort((a,b)=>a-b); const m=ys[Math.floor((ys.length-1)/2)]; r.items.forEach(p=>p.y=m); });
  // 3. inside a column: neighbours that are close get exactly one gutter between them
  cols.forEach(c=>{ c.items.sort((a,b)=>a.y-b.y);
    for(let i=1;i<c.items.length;i++){ const a=c.items[i-1], b=c.items[i]; if(b.y-(a.y+a.h)<GAP*2.5) b.y=a.y+a.h+GAP; } });
  // 4. between columns: close neighbours get exactly one gutter
  cols.sort((a,b)=>a.x-b.x);
  for(let i=1;i<cols.length;i++){
    const prev=cols[i-1], cur=cols[i], right=Math.max(...prev.items.map(p=>p.x+p.w));
    const gap=cur.x-right; if(gap<GAP*2.5){ const nx=right+GAP; cols.slice(i).forEach(c=>{ const d=nx-cur.x; c.items.forEach(p=>p.x+=d); c.x+=d; }); }
  }
  // 5. clear any remaining overlap, moving whole columns sideways or the rest of a column down
  for(let pass=0;pass<80;pass++){
    let moved=false;
    for(let i=0;i<it.length;i++) for(let j=i+1;j<it.length;j++){
      const a=it[i], b=it[j];
      const ox=Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x)+GAP, oy=Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y)+GAP;
      if(ox<=0||oy<=0) continue;
      if(a.col===b.col||oy<=ox){ const [t,u]=a.y<=b.y?[a,b]:[b,a]; const d=t.y+t.h+GAP-u.y; u.col.items.filter(p=>p.y>=u.y).forEach(p=>p.y+=d); }
      else { const [l,r]=a.x<=b.x?[a,b]:[b,a]; const d=l.x+l.w+GAP-r.x; r.col.items.forEach(p=>p.x+=d); r.col.x+=d; }
      moved=true;
    }
    if(!moved) break;
  }
  let changed=false;
  it.forEach(p=>{ if(p.n.fx!==p.x||p.n.fy!==p.y) changed=true; p.n.fx=p.x; p.n.fy=p.y; });
  if(!changed){ toast('Already tidy'); return; }
  relayout(); save();
  undoTidy=before; tidyLabel(true);
  clearTimeout(undoTimer); undoTimer=setTimeout(()=>{ undoTidy=null; syncTidy(); },8000);
}
function revertTidy(){
  if(!undoTidy) return; undoTidy.forEach((p,id)=>{ const n=node(id); if(n){ n.fx=p.x; n.fy=p.y; } });
  undoTidy=null; clearTimeout(undoTimer); relayout(); save(); toast('Tidy undone');
}
function tidyLabel(undo){ $('#btn-tidy').innerHTML=icon(undo?'undo':'grid')+'<span class="t">'+(undo?'Undo tidy':'Tidy')+'</span>'; }
function syncTidy(){
  const b=$('#btn-tidy'); const ok=S.layout==='free'&&S.mode==='edit';
  b.disabled=!ok; b.title=ok?'Align nodes to the grid with equal spacing (T)':'Tidy works in the Free view while editing';
  if(!ok){ undoTidy=null; clearTimeout(undoTimer); }
  if(!undoTidy) tidyLabel(false);
}
$('#btn-tidy').onclick=()=>undoTidy?revertTidy():tidy();

/* ---------- view (pan/zoom) ---------- */
function applyView(){
  const v=S.view, a=24*v.k, b=120*v.k;
  world.style.transform='translate('+v.x+'px,'+v.y+'px) scale('+v.k+')';
  canvas.style.backgroundSize=b+'px '+b+'px,'+b+'px '+b+'px,'+a+'px '+a+'px,'+a+'px '+a+'px';
  canvas.style.backgroundPosition=Array(4).fill(v.x+'px '+v.y+'px').join(',');
  $('#z-val').textContent=Math.round(v.k*100)+'%';
}
function zoomAt(k,cx,cy){
  const v=S.view; k=Math.max(.15,Math.min(2.5,k));
  const wx=(cx-v.x)/v.k, wy=(cy-v.y)/v.k; v.k=k; v.x=cx-wx*k; v.y=cy-wy*k; applyView();
}
function animateView(to){
  const fromV={...S.view}; if(reduced){ Object.assign(S.view,to); applyView(); return; }
  const t0=performance.now(), D=420;
  const step=now=>{ const t=Math.min(1,(now-t0)/D), e=1-Math.pow(1-t,3);
    S.view.x=fromV.x+(to.x-fromV.x)*e; S.view.y=fromV.y+(to.y-fromV.y)*e; S.view.k=fromV.k+(to.k-fromV.k)*e; applyView();
    if(t<1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function visibleArea(){
  const r=canvas.getBoundingClientRect(); let left=0, right=r.width, bottom=r.height;
  if(!insp.hidden){ if(innerWidth>900) right-=insp.offsetWidth+24; else bottom-=insp.offsetHeight; }
  if(!$('#filters').hidden && innerWidth>900) left+=$('#filters').offsetWidth+24;
  return {left,right,top:0,bottom,r};
}
function fit(animate=true){
  const vis=S.nodes.filter(n=>!S.vis.hidden.has(n.id)); if(!vis.length) return;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  vis.forEach(n=>{ x0=Math.min(x0,n.tx);y0=Math.min(y0,n.ty);x1=Math.max(x1,n.tx+n.w);y1=Math.max(y1,n.ty+n.h); });
  if(S.bg?.type==='cluster'){ S.bg.halos.forEach(g=>g.rects.forEach(r=>{x0=Math.min(x0,r.x);y0=Math.min(y0,r.y);x1=Math.max(x1,r.x+r.w);y1=Math.max(y1,r.y+r.h);}));
    S.bg.labels.forEach(l=>{x0=Math.min(x0,l.x-170);x1=Math.max(x1,l.x+170);y0=Math.min(y0,l.y-34);y1=Math.max(y1,l.y+34);}); }
  if(S.bg?.type==='timeline'){ x0=Math.min(x0,-60); y0=Math.min(y0,-40); x1=Math.max(x1,S.bg.w); }
  const a=visibleArea(), pad=50, aw=a.right-a.left-pad*2, ah=a.bottom-a.top-pad*2-60;
  const k=Math.max(.15,Math.min(1.1,aw/(x1-x0),ah/(y1-y0)));
  const to={k,x:a.left+pad+(aw-(x1-x0)*k)/2-x0*k,y:a.top+pad+(ah-(y1-y0)*k)/2-y0*k};
  animate?animateView(to):(Object.assign(S.view,to),applyView());
}
function centerOn(id){
  const n=node(id); if(!n) return; const a=visibleArea(); const k=Math.max(S.view.k,.8);
  animateView({k,x:(a.left+a.right)/2-(n.x+n.w/2)*k,y:(a.top+a.bottom)/2-(n.y+n.h/2)*k});
}

/* ---------- pointer handling ---------- */
const ptrs=new Map(); let gesture=null, pinch=null;
const local=e=>{ const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
const toWorld=p=>({x:(p.x-S.view.x)/S.view.k,y:(p.y-S.view.y)/S.view.k});

function panGesture(e,onClick){
  const s=local(e), v0={...S.view}; let moved=false;
  return {move(e){ const p=local(e); if(!moved&&Math.hypot(p.x-s.x,p.y-s.y)<4) return; moved=true; canvas.classList.add('panning');
      S.view.x=v0.x+p.x-s.x; S.view.y=v0.y+p.y-s.y; applyView(); },
    up(){ canvas.classList.remove('panning'); if(!moved&&onClick) onClick(); }};
}
canvas.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse') return;
  hideQuick();
  ptrs.set(e.pointerId,local(e));
  if(ptrs.size===2){ gesture?.cancel?.(); gesture=null; const [a,b]=[...ptrs.values()]; pinch={d:Math.hypot(a.x-b.x,a.y-b.y),k:S.view.k}; return; }
  const port=e.target.closest('.port'), nEl=e.target.closest('.node');
  if(port&&S.mode==='edit'){ e.preventDefault(); gesture=connectGesture(nEl.dataset.id,e); return; }
  if(nEl){
    const n=node(nEl.dataset.id);
    if(S.mode==='edit'&&S.layout==='free'){
      const s=local(e), ox=n.x, oy=n.y; let moved=false;
      gesture={move(e){ const p=local(e); if(!moved&&Math.hypot(p.x-s.x,p.y-s.y)<4) return; moved=true;
          n.x=n.fx=n.tx=ox+(p.x-s.x)/S.view.k; n.y=n.fy=n.ty=oy+(p.y-s.y)/S.view.k; placeNode(n); renderEdges(); },
        up(){ if(moved) save(); else select(n.id); }};
    } else gesture=panGesture(e,()=>select(n.id));
    return;
  }
  gesture=panGesture(e,()=>select(null));
});
addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,local(e));
  if(pinch&&ptrs.size>=2){ const [a,b]=[...ptrs.values()]; zoomAt(pinch.k*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d,(a.x+b.x)/2,(a.y+b.y)/2); return; }
  if(gesture) gesture.move(e);
});
addEventListener('pointerup',e=>{ ptrs.delete(e.pointerId); if(ptrs.size<2) pinch=null; if(gesture){ const g=gesture; gesture=null; g.up(e); } });
addEventListener('pointercancel',e=>{ ptrs.delete(e.pointerId); pinch=null; if(gesture){ gesture.cancel?.(); gesture=null; canvas.classList.remove('panning'); } });

/* connecting: the thread follows the pointer and locks onto the nearest node within reach */
function connectGesture(fromId,e0){
  const a=node(fromId), linked=new Set(neighbors(fromId)), SNAP=80;
  let target=null, startP=local(e0), lastP=startP, endW=null;
  document.body.classList.add('connecting');
  els.get(fromId)?.classList.add('src');
  linked.forEach(id=>els.get(id)?.classList.add('no-drop'));
  const setTarget=t=>{ if(target===t) return; if(target) els.get(target.id)?.classList.remove('drop'); target=t; if(t) els.get(t.id)?.classList.add('drop'); };
  const draw=p=>{
    lastP=p; const w=toWorld(p); endW=w; let best=null, bd=Infinity;
    S.nodes.forEach(n=>{
      if(n.id===fromId||linked.has(n.id)||S.vis.hidden.has(n.id)) return;
      const dx=Math.max(n.x-w.x,0,w.x-(n.x+n.w)), dy=Math.max(n.y-w.y,0,w.y-(n.y+n.h));
      const d=Math.hypot(dx,dy)*S.view.k; if(d<bd){ bd=d; best=n; }
    });
    setTarget(bd<=SNAP?best:null);
    const g=target?link(a,target):toPoint(a,w), k=S.view.k;
    temp.setAttribute('d',g.d); temp.classList.toggle('snapped',!!target);
    temp.setAttribute('marker-end',target?'':'');
    dot.setAttribute('cx',f2(g.p2.x)); dot.setAttribute('cy',f2(g.p2.y)); dot.setAttribute('r',f2(5/k)); dot.style.strokeWidth=2/k; dot.classList.toggle('on',!!target);
    tip.setAttribute('font-size',f2(10/k)); tip.style.strokeWidth=6/k;
    tip.setAttribute('x',f2(g.p2.x+12/k)); tip.setAttribute('y',f2(g.p2.y-12/k));
    tip.textContent=target?'Release · '+EK[defaultKind(a,target)]:'Release · new node';
    show(temp,true); show(dot,true); show(tip,true);
  };
  const cleanup=()=>{
    document.body.classList.remove('connecting'); setTarget(null);
    els.get(fromId)?.classList.remove('src'); linked.forEach(id=>els.get(id)?.classList.remove('no-drop'));
    show(temp,false); show(dot,false); show(tip,false); temp.setAttribute('d',''); temp.classList.remove('snapped');
  };
  draw(startP);
  return {
    move(e){ draw(local(e)); },
    cancel:cleanup,
    up(e){
      const t=target, p=local(e), moved=Math.hypot(p.x-startP.x,p.y-startP.y)>30; cleanup();
      if(t){ const kind=defaultKind(a,t); S.edges.push({id:uid('e'),from:fromId,to:t.id,kind}); save(); select(fromId); toast('Connected · '+EK[kind]); return; }
      if(moved&&endW) showQuick(fromId,p,endW);
    }};
}
function showQuick(fromId,p,w){
  quick.innerHTML='<div class="lbl">New connected node</div>'+['video','link','bookmark','person','note'].map(t=>'<button role="menuitem" data-qadd="'+t+'">'+icon('plus')+KINDS[t]+'</button>').join('');
  show(quick,true);
  const r=canvas.getBoundingClientRect();
  quick.style.left=Math.min(p.x+10,r.width-quick.offsetWidth-12)+'px'; quick.style.top=Math.min(p.y+10,r.height-quick.offsetHeight-12)+'px';

canvas.addEventListener('wheel',e=>{
  e.preventDefault(); const p=local(e);
  const mouseWheel=e.deltaMode===1||(e.deltaX===0&&Math.abs(e.deltaY)>=50&&Number.isInteger(e.deltaY));
  if(e.ctrlKey||e.metaKey||mouseWheel) zoomAt(S.view.k*Math.exp(-e.deltaY*(e.ctrlKey?.01:.0018)),p.x,p.y);
  else { S.view.x-=e.deltaX; S.view.y-=e.deltaY; applyView(); }
},{passive:false});

function publicHTML(n){
  const tps=n.topics.map(topic).filter(Boolean);
  const chips=tps.length?'<div class="chips">'+tps.map(t=>'<button class="chip dot" style="--tc:'+t.color+'" data-ftopic="'+t.id+'">'+esc(t.name)+'</button>').join('')+'</div>':'';
  if(n.type==='person'){
    let h='<div class="ih"><span class="lbl">Person</span><button class="x" data-act="close" aria-label="Close">'+icon('x')+'</button></div><div class="ib">';
    h+=avatar(n,'pv-avatar')+'<h2 class="pv-title">'+esc(n.title||'Unnamed person')+'</h2><div class="pv-meta">'+esc(personMeta(n))+'</div>';
    if(n.summary) h+='<p class="pv-sum">'+esc(n.summary)+'</p>';
    h+=chips;
    const links=[]; if(handleOf(n)) links.push('<a class="btn primary" href="https://x.com/'+encodeURIComponent(handleOf(n))+'" target="_blank" rel="noopener">Follow @'+esc(handleOf(n))+''+icon('ext')+'</a>');
    if(n.url&&!isXUrl(n.url)) links.push('<a class="btn" href="'+esc(n.url)+'" target="_blank" rel="noopener">'+esc(host(n.url))+''+icon('ext')+'</a>');
    if(links.length) h+='<div class="btns">'+links.join('')+'</div>';
    return h+'<div class="hr"></div>'+connHTML(n,false)+'</div>';
  }
  let h='<div class="ih"><span class="lbl">'+KINDS[n.type]+(n.type==='video'&&PLATS[n.platform]?' · '+PLATS[n.platform].label:'')+'</span><button class="x" data-act="close" aria-label="Close">'+icon('x')+'</button></div><div class="ib">';
  if(n.type==='video') h+=thumbHTML(n,'pv-thumb');
  h+='<h2 class="pv-title">'+esc(n.title||'Untitled')+'</h2>';
  h+='<div class="pv-meta">'+(n.type==='video'?'<span class="badge st-'+n.status+'">'+STAT[n.status]+'</span>':'')+(n.date?'<span>'+fmt(n.date)+'</span>':'')+(n.url&&n.type!=='video'?'<span>'+esc(host(n.url))+'</span>':'')+'</div>';
  if(n.summary) h+='<p class="pv-sum">'+esc(n.summary)+'</p>';
  h+=chips;
  if(n.url) h+='<div class="btns"><a class="btn primary" href="'+esc(n.url)+'" target="_blank" rel="noopener">'+(n.type==='video'&&PLATS[n.platform]?'Watch on '+PLATS[n.platform].label:'Open link')+''+icon('ext')+'</a></div>';
  if(statsHTML(n)) h+='<div class="hr"></div>'+statsHTML(n);
  return h+'<div class="hr"></div>'+connHTML(n,false)+'</div>';
}
insp.addEventListener('input',e=>{
  const f=e.target.dataset.f; const n=node(S.sel); if(!f||!n) return;
  n[f]=e.target.type==='checkbox'?e.target.checked:e.target.value;
  updateNode(n); renderEdges(); save();
  if(f==='private') refresh();
  if((f==='date'||f==='platform')&&S.layout==='timeline') relayout();
});
insp.addEventListener('change',e=>{
  const eid=e.target.dataset.edge; if(eid){ const ed=S.edges.find(x=>x.id===eid); ed.kind=e.target.value; renderEdges(); save(); }
});
insp.addEventListener('keydown',e=>{
  if(e.target.id==='f-newtopic'&&e.key==='Enter'){
    const name=e.target.value.trim(); if(!name) return; const n=node(S.sel);
    let t=S.topics.find(t=>t.name.toLowerCase()===name.toLowerCase());
    if(!t){ t={id:uid('t'),name,color:PAL[S.topics.length%PAL.length]}; S.topics.push(t); }
    if(!n.topics.includes(t.id)) n.topics.push(t.id);
    updateNode(n); save(); renderFilters(); renderInspector(); if(S.layout!=='free') relayout();
    $('#f-newtopic')?.focus();
  }
});
insp.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const n=node(S.sel);
  if(b.dataset.go){ select(b.dataset.go); centerOn(b.dataset.go); return; }
  if(b.dataset.ftopic){ S.f.topics=new Set([b.dataset.ftopic]); refresh(); toast('Filtered to '+topic(b.dataset.ftopic).name); return; }
  if(b.dataset.status){ n.status=b.dataset.status; if(n.status==='published'&&!n.date) n.date=TODAY; updateNode(n); save(); renderInspector(); refresh(); if(S.layout!=='free') relayout(); return; }
  if(b.dataset.topic){ const i=n.topics.indexOf(b.dataset.topic); i>=0?n.topics.splice(i,1):n.topics.push(b.dataset.topic); updateNode(n); save(); renderInspector(); refresh(); if(S.layout!=='free') relayout(); return; }
  if(b.dataset.rm){ S.edges=S.edges.filter(x=>x.id!==b.dataset.rm); save(); renderEdges(); renderInspector(); applyClasses(); return; }
  const act=b.dataset.act;
  if(act==='close') select(null);
  if(act==='del'){ confirmDel=true; renderInspector(); }
  if(act==='nodel'){ confirmDel=false; renderInspector(); }
  if(act==='del2'){ S.nodes=S.nodes.filter(x=>x.id!==n.id); S.edges=S.edges.filter(x=>x.from!==n.id&&x.to!==n.id); renderAllNodes(); select(null); relayout(); save(); renderFilters(); toast('Deleted'); }
  if(act==='attach'){
    const title=$('#a-title').value.trim(), url=$('#a-url').value.trim(), type=$('#a-type').value;
    if(!title&&!url){ toast('Add a title or a URL to attach'); return; }
    const extra={title:title||host(url),url,topics:n.topics.slice(0,1)};
    if(type==='person'&&isXUrl(url)){ extra.handle=handleOf({url}); }
    const m=addNode(type,{x:n.fx+n.w+GAP*2,y:n.fy+n.h+GAP},extra,false);
    S.edges.push({id:uid('e'),from:n.id,to:m.id,kind:defaultKind(n,m)}); save(); renderEdges(); renderInspector(); toast(KINDS[type]+' attached');
  }
});

/* ---------- adding ---------- */
function addNode(type,at,extra={},selectIt=true){
  if(!at){ const a=visibleArea(); const c=toWorld({x:(a.left+a.right)/2,y:(a.top+a.bottom)/2}); at={x:c.x-W[type]/2,y:c.y-80}; }
  const n={id:uid('n'),type,title:'',summary:'',platform:type==='video'?'youtube':null,status:type==='video'?'draft':null,
    date:type==='video'?'':TODAY,url:'',handle:'',duration:'',topics:[],private:type==='note',fx:at.x,fy:at.y,x:at.x,y:at.y,...extra};
  S.nodes.push(n); ensureEl(n); n.h=els.get(n.id).offsetHeight;
  relayout(); placeNode(n); renderFilters(); save();
  if(selectIt){ select(n.id); setTimeout(()=>$('#f-title')?.focus(),30); }
  return n;
}
$('#dock').addEventListener('click',e=>{ const b=e.target.closest('[data-add]'); if(b) addNode(b.dataset.add); });

/* ---------- filters panel ---------- */
function renderFilters(){
  const vis=S.nodes.filter(n=>S.mode==='edit'||!(n.private||(n.type==='video'&&(n.status==='idea'||n.status==='draft'))));
  $('#fp-topics').innerHTML=S.topics.map(t=>{ const c=vis.filter(n=>n.topics.includes(t.id)).length; return c||S.mode==='edit'?'<button class="chip dot" style="--tc:'+t.color+'" data-t="'+t.id+'" aria-pressed="'+S.f.topics.has(t.id)+'">'+esc(t.name)+' <i>'+c+'</i></button>':''; }).join('');
  $('#fp-plat').innerHTML=Object.keys(PLATS).map(p=>'<button class="chip" data-p="'+p+'" aria-pressed="'+S.f.plats.has(p)+'">'+PLATS[p].label+' <i>'+vis.filter(n=>n.type==='video'&&n.platform===p).length+'</i></button>').join('');
  $('#fp-status').innerHTML=Object.keys(STAT).map(s=>'<button class="chip" data-s="'+s+'" aria-pressed="'+S.f.stats.has(s)+'">'+STAT[s]+' <i>'+S.nodes.filter(n=>n.type==='video'&&n.status===s).length+'</i></button>').join('');
  $('#fp-status-sec').hidden=S.mode!=='edit';
  const shown=S.nodes.length-S.vis.hidden.size-S.vis.dim.size;
  $('#fp-count').textContent=shown+' shown'+(S.vis.dim.size?' · '+S.vis.dim.size+' dimmed':'');
}
$('#filters').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const tog=(set,v)=>set.has(v)?set.delete(v):set.add(v);
  if(b.dataset.t) tog(S.f.topics,b.dataset.t);
  else if(b.dataset.p) tog(S.f.plats,b.dataset.p);
  else if(b.dataset.s) tog(S.f.stats,b.dataset.s);
  else if(b.id==='fp-clear'){ S.f.topics.clear();S.f.plats.clear();S.f.stats.clear();S.f.q='';$('#q').value=''; }
  else return;
  if(S.f.hide||S.layout!=='free') relayout(); refresh();
});
$('#q').addEventListener('input',e=>{ S.f.q=e.target.value.trim(); if(S.f.hide) relayout(); refresh(); });
$('#fp-hide').addEventListener('change',e=>{ S.f.hide=e.target.checked; relayout(); refresh(); });
$('#btn-filters').addEventListener('click',()=>{ const f=$('#filters'); f.hidden=!f.hidden; $('#btn-filters').setAttribute('aria-pressed',String(!f.hidden)); });

/* ---------- control strip ---------- */
function setLayout(l){
  S.layout=l; document.querySelectorAll('[data-layout]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.layout===l)));
  relayout(); setTimeout(()=>fit(),reduced?0:120);
}
function setMode(m){
  S.mode=m; document.body.classList.toggle('public',m==='public');
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===m)));
  $('#dock').hidden=m!=='edit'; $('#banner').hidden=m!=='public'; $('#btn-data').hidden=m!=='edit';
  if(m==='public') S.f.stats.clear();
  relayout(); refresh(); renderInspector(); setTimeout(()=>fit(),reduced?0:120);
}
document.querySelectorAll('[data-layout]').forEach(b=>b.addEventListener('click',()=>setLayout(b.dataset.layout)));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
$('#z-in').onclick=()=>{ const a=visibleArea(); zoomAt(S.view.k*1.25,(a.left+a.right)/2,(a.top+a.bottom)/2); };
$('#z-out').onclick=()=>{ const a=visibleArea(); zoomAt(S.view.k/1.25,(a.left+a.right)/2,(a.top+a.bottom)/2); };
$('#z-fit').onclick=()=>fit();
addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select')||e.altKey) return;
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&undoTidy){ e.preventDefault(); revertTidy(); return; }
  if(e.metaKey||e.ctrlKey) return;
  const k=e.key.toLowerCase();
  if(k==='f') fit();
  if(k==='t') undoTidy?revertTidy():tidy();
  if(k==='1') setLayout('free'); if(k==='2') setLayout('cluster'); if(k==='3') setLayout('timeline');
  if(e.key==='Escape'){ if(!quick.hidden) hideQuick(); else if(!$('#data-dlg').hidden) $('#data-dlg').hidden=true; else select(null); }
});

/* ---------- data dialog ---------- */
const dlg=$('#data-dlg');
$('#btn-data').onclick=()=>{ $('#dlg-json').value=JSON.stringify(serialize(),null,2); $('#dlg-msg').textContent=''; dlg.hidden=false; };
$('#dlg-close').onclick=()=>dlg.hidden=true;
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.hidden=true; });
$('#dlg-copy').onclick=()=>{
  const ta=$('#dlg-json');
  navigator.clipboard.writeText(ta.value).then(()=>{ $('#dlg-msg').textContent='Copied to clipboard.'; })
    .catch(()=>{ ta.focus(); ta.select(); $('#dlg-msg').textContent='Copy was blocked here. The text is selected: press Ctrl/Cmd + C.'; });
};
$('#dlg-load').onclick=()=>{
  try{ const d=JSON.parse($('#dlg-json').value); if(!Array.isArray(d.nodes)||!Array.isArray(d.edges)) throw new Error('Expected { topics, nodes, edges }');
    boot(d); dlg.hidden=true; toast('Map loaded'); }
  catch(err){ $('#dlg-msg').textContent='Could not load: '+err.message+'. Check the JSON and try again.'; }
};
$('#dlg-reset').onclick=()=>{ boot(seed()); dlg.hidden=true; toast('Sample map restored'); };

/* ---------- boot ---------- */
function boot(data){
  load(data); S.sel=null; insp.hidden=true;
  nodesEl.innerHTML=''; els.clear(); renderAllNodes();
  relayout(false); renderFilters(); fit(false); save();
}
let theme='dark'; try{ theme=localStorage.getItem(THEME_KEY)||'dark'; }catch(e){}
setTheme(theme==='paper');
let initial=null; try{ const raw=localStorage.getItem(KEY); if(raw) initial=JSON.parse(raw); }catch(e){}
if(innerWidth<=900){ $('#filters').hidden=true; $('#btn-filters').setAttribute('aria-pressed','false'); }
const start=()=>boot(initial&&initial.nodes?initial:seed());
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
addEventListener('resize',()=>applyView());
})();
</script>
